<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑目录 - {{ catalog.catalog_name }}</title>
    <style>
        body { background: #f7fafc; font-family: 'Microsoft YaHei', sans-serif; }
        .container { max-width: 700px; margin: 3rem auto; background: white; border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { margin-bottom: 2rem; }
        .header h2 { color: #2d3748; margin: 0; }
        .breadcrumb { font-size: 0.85rem; color: #718096; margin-bottom: 0.5rem; }
        .breadcrumb a { color: #667eea; text-decoration: none; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 600; color: #2d3748; margin-bottom: 0.4rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.65rem 0.9rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .info-box { background: #ebf8ff; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; color: #2c5282; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none;
            padding: 0.75rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .btn-secondary { background: #e2e8f0; color: #4a5568; border: none; padding: 0.75rem 1.5rem; border-radius: 10px; cursor: pointer; margin-left: 0.5rem; }
        .btn-secondary:hover { background: #cbd5e0; }
        .actions { margin-top: 2rem; display: flex; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="breadcrumb">
            <a href="{{ url_for('archive.fonds_list') }}">全宗管理</a> /
            <a href="{{ url_for('archive.catalog_list', fonds_id=catalog.fonds_id) }}">{{ catalog.fonds.fonds_name }}</a> /
            编辑目录
        </div>
        <h2>📁 编辑目录</h2>
    </div>

    <div class="info-box">
        当前所属全宗：<strong>{{ catalog.fonds.fonds_code }} - {{ catalog.fonds.fonds_name }}</strong>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>目录号/分类号 <span style="color:red">*</span></label>
            <input type="text" name="catalog_code" value="{{ catalog.catalog_code }}" required placeholder="如：WS、KJ、CW">
        </div>

        <div class="form-group">
            <label>目录名称 <span style="color:red">*</span></label>
            <input type="text" name="catalog_name" value="{{ catalog.catalog_name }}" required placeholder="如：文书档案">
        </div>

        <div class="form-group">
            <label>目录类型</label>
            <select name="catalog_type">
                <option value="文书" {% if catalog.catalog_type == '文书' %}selected{% endif %}>文书档案</option>
                <option value="科技" {% if catalog.catalog_type == '科技' %}selected{% endif %}>科技档案</option>
                <option value="会计" {% if catalog.catalog_type == '会计' %}selected{% endif %}>会计档案</option>
                <option value="声像" {% if catalog.catalog_type == '声像' %}selected{% endif %}>声像档案</option>
                <option value="实物" {% if catalog.catalog_type == '实物' %}selected{% endif %}>实物档案</option>
                <option value="其他" {% if catalog.catalog_type == '其他' %}selected{% endif %}>其他</option>
            </select>
        </div>

        <div class="form-group">
            <label>保管期限</label>
            <select name="retention_period">
                <option value="永久" {% if catalog.retention_period == '永久' %}selected{% endif %}>永久</option>
                <option value="30年" {% if catalog.retention_period == '30年' %}selected{% endif %}>30年</option>
                <option value="10年" {% if catalog.retention_period == '10年' %}selected{% endif %}>10年</option>
            </select>
        </div>

        <div class="form-group">
            <label>目录说明</label>
            <textarea name="description" rows="3" placeholder="归档范围说明">{{ catalog.description or '' }}</textarea>
        </div>

        <div class="actions">
            <button type="submit" class="btn-primary">💾 保存修改</button>
            <a href="{{ url_for('archive.catalog_list', fonds_id=catalog.fonds_id) }}"><button type="button" class="btn-secondary">取消</button></a>
        </div>
    </form>
</div>
</body>
</html>
