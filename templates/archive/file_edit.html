<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑档案 - {{ file.title }}</title>
    <style>
        body { background: #f7fafc; font-family: 'Microsoft YaHei', sans-serif; }
        .container { max-width: 900px; margin: 2.5rem auto; background: white; border-radius: 16px; padding: 2.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .header { margin-bottom: 2rem; }
        .header h2 { color: #2d3748; margin: 0; }
        .breadcrumb { font-size: 0.85rem; color: #718096; margin-bottom: 0.5rem; }
        .breadcrumb a { color: #667eea; text-decoration: none; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 600; color: #2d3748; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 0.65rem 0.9rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .row { display: flex; gap: 1rem; }
        .row .form-group { flex: 1; }
        .row-3 { display: flex; gap: 1rem; }
        .row-3 .form-group { flex: 1; }
        .info-box { background: #fff8ed; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.9rem; color: #92400e; }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none;
            padding: 0.75rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(102,126,234,0.4); }
        .btn-secondary { background: #e2e8f0; color: #4a5568; border: none; padding: 0.75rem 1.5rem; border-radius: 10px; cursor: pointer; margin-left: 0.5rem; text-decoration: none; display: inline-block; }
        .btn-secondary:hover { background: #cbd5e0; color: #4a5568; text-decoration: none; }
        .section-title { font-size: 1rem; font-weight: 700; color: #667eea; margin: 1.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #edf2f7; }
        textarea { resize: vertical; min-height: 80px; }
        .current-badge { display: inline-block; background: #dbeafe; color: #1d4ed8; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; margin-left: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="breadcrumb">
            <a href="{{ url_for('archive.index') }}">档案管理</a> &gt;
            <a href="{{ url_for('archive.file_list') }}">档案列表</a> &gt;
            <a href="{{ url_for('archive.file_detail', file_id=file.id) }}">{{ file.title[:20] }}...</a> &gt;
            编辑
        </div>
        <h2>编辑档案</h2>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div style="padding:0.75rem 1rem; border-radius:8px; margin-bottom:1rem; background:{{ '#fee2e2' if category=='error' else '#d1fae5' }}; color:{{ '#991b1b' if category=='error' else '#065f46' }};">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- 归属信息 -->
        <div class="section-title">归属信息</div>
        <div class="row">
            <div class="form-group">
                <label>全宗 <span class="text-danger">*</span></label>
                <select name="fonds_id" id="fondsSelect" required onchange="loadCatalogs()">
                    <option value="">请选择全宗</option>
                    {% for f in fonds_list %}
                    <option value="{{ f.id }}" {% if file.fonds_id == f.id %}selected{% endif %}>{{ f.fonds_code }} - {{ f.fonds_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>目录 <span class="text-danger">*</span></label>
                <select name="catalog_id" id="catalogSelect" required onchange="loadVolumes()">
                    <option value="">请先选择全宗</option>
                    {% for c in catalog_list %}
                    <option value="{{ c.id }}" {% if file.catalog_id == c.id %}selected{% endif %}>{{ c.catalog_code }} - {{ c.catalog_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>案卷</label>
                <select name="volume_id" id="volumeSelect">
                    <option value="">不归档到案卷</option>
                    {% for v in volume_list %}
                    <option value="{{ v.id }}" {% if file.volume_id == v.id %}selected{% endif %}>{{ v.volume_code }} - {{ v.volume_title[:30] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="section-title">基本信息</div>

        <div class="row">
            <div class="form-group">
                <label>档号 <span class="text-danger">*</span></label>
                <input type="text" name="file_code" value="{{ file.file_code or '' }}" required placeholder="如：0001">
            </div>
            <div class="form-group" style="flex:2;">
                <label>题名 <span class="text-danger">*</span></label>
                <input type="text" name="title" value="{{ file.title or '' }}" required placeholder="文件标题或题名">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>责任者</label>
                <input type="text" name="responsibility" value="{{ file.responsibility or '' }}" placeholder="文件形成单位或个人">
            </div>
            <div class="form-group">
                <label>文号</label>
                <input type="text" name="reference_number" value="{{ file.reference_number or '' }}" placeholder="如：×府发〔2024〕1号">
            </div>
        </div>

        <div class="row-3">
            <div class="form-group">
                <label>文件日期</label>
                <input type="date" name="file_date" value="{{ file.file_date.strftime('%Y-%m-%d') if file.file_date else '' }}">
            </div>
            <div class="form-group">
                <label>年度</label>
                <input type="number" name="file_year" value="{{ file.file_year or '' }}" placeholder="如：2024">
            </div>
            <div class="form-group">
                <label>页数</label>
                <input type="number" name="page_count" value="{{ file.page_count or '' }}" min="0" placeholder="页数">
            </div>
        </div>

        <div class="section-title">档案分类</div>

        <div class="row-3">
            <div class="form-group">
                <label>档案类型</label>
                <select name="archive_type">
                    <option value="">请选择</option>
                    <option value="通知" {% if file.archive_type=='通知' %}selected{% endif %}>通知</option>
                    <option value="请示" {% if file.archive_type=='请示' %}selected{% endif %}>请示</option>
                    <option value="报告" {% if file.archive_type=='报告' %}selected{% endif %}>报告</option>
                    <option value="函" {% if file.archive_type=='函' %}selected{% endif %}>函</option>
                    <option value="决定" {% if file.archive_type=='决定' %}selected{% endif %}>决定</option>
                    <option value="批复" {% if file.archive_type=='批复' %}selected{% endif %}>批复</option>
                    <option value="意见" {% if file.archive_type=='意见' %}selected{% endif %}>意见</option>
                    <option value="其他" {% if file.archive_type=='其他' %}selected{% endif %}>其他</option>
                </select>
            </div>
            <div class="form-group">
                <label>保管期限</label>
                <select name="retention_period">
                    <option value="">请选择</option>
                    <option value="永久" {% if file.retention_period=='永久' %}selected{% endif %}>永久</option>
                    <option value="30年" {% if file.retention_period=='30年' %}selected{% endif %}>30年</option>
                    <option value="10年" {% if file.retention_period=='10年' %}selected{% endif %}>10年</option>
                </select>
            </div>
            <div class="form-group">
                <label>密级</label>
                <select name="security_level">
                    <option value="公开" {% if file.security_level=='公开' %}selected{% endif %}>公开</option>
                    <option value="内部" {% if file.security_level=='内部' %}selected{% endif %}>内部</option>
                    <option value="秘密" {% if file.security_level=='秘密' %}selected{% endif %}>秘密</option>
                    <option value="机密" {% if file.security_level=='机密' %}selected{% endif %}>机密</option>
                    <option value="绝密" {% if file.security_level=='绝密' %}selected{% endif %}>绝密</option>
                </select>
            </div>
        </div>

        <div class="section-title">存放与管理</div>

        <div class="form-group">
            <label>存放位置</label>
            <input type="text" name="storage_location" value="{{ file.storage_location or '' }}" placeholder="如：A区-01架-03层-05号">
        </div>

        <div class="section-title">AI智能提取
            <button type="button" id="btnReExtract" class="btn-sm" style="margin-left:0.5rem;font-size:0.8rem;padding:0.2rem 0.6rem;background:#667eea;color:white;border:none;border-radius:6px;cursor:pointer;">
                <i class="fas fa-magic me-1"></i>重新提取
            </button>
        </div>

        <div class="form-group">
            <label>关键词</label>
            <input type="text" name="keywords" id="inputKeywords" value="{{ file.keywords or '' }}" placeholder="多个关键词用英文逗号分隔">
        </div>

        <div class="form-group">
            <label>标签</label>
            <input type="text" name="tags" id="inputTags" value="{{ file.tags or '' }}" placeholder="多个标签用英文逗号分隔">
        </div>

        <div class="form-group">
            <label>摘要</label>
            <textarea name="summary" id="inputSummary" rows="3" placeholder="自动生成的文档摘要，可手动修改">{{ file.summary or '' }}</textarea>
        </div>

        <div class="form-group">
            <label>说明</label>
            <textarea name="description" rows="3" placeholder="档案内容简介或备注">{{ file.description or '' }}</textarea>
        </div>

        <div class="info-box" id="extractStatus" style="display:none;">
            <i class="fas fa-info-circle"></i> <span id="extractMsg"></span>
        </div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i> 提示：此处仅编辑档案元数据，不支持更换附件。如需更换附件，请删除本档案后重新上传。
        </div>

        <div style="text-align:right;">
            <a href="{{ url_for('archive.file_detail', file_id=file.id) }}" class="btn-secondary">取消</a>
            <button type="submit" class="btn-primary"><i class="fas fa-check me-1"></i>保存修改</button>
        </div>
    </form>
</div>

<script>
function loadCatalogs() {
    const fondsId = document.getElementById('fondsSelect').value;
    const catalogSelect = document.getElementById('catalogSelect');
    const volumeSelect = document.getElementById('volumeSelect');
    catalogSelect.innerHTML = '<option value="">加载中...</option>';
    volumeSelect.innerHTML = '<option value="">请先选择目录</option>';
    if (!fondsId) {
        catalogSelect.innerHTML = '<option value="">请先选择全宗</option>';
        return;
    }
    fetch('/archive/api/catalogs?fonds_id=' + fondsId)
        .then(r => r.json())
        .then(data => {
            catalogSelect.innerHTML = '<option value="">请选择目录</option>';
            data.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.catalog_code + ' - ' + c.catalog_name;
                catalogSelect.appendChild(opt);
            });
        })
        .catch(() => { catalogSelect.innerHTML = '<option value="">加载失败</option>'; });
}

function loadVolumes() {
    const catalogId = document.getElementById('catalogSelect').value;
    const volumeSelect = document.getElementById('volumeSelect');
    volumeSelect.innerHTML = '<option value="">加载中...</option>';
    if (!catalogId) {
        volumeSelect.innerHTML = '<option value="">请先选择目录</option>';
        return;
    }
    fetch('/archive/api/volumes?catalog_id=' + catalogId)
        .then(r => r.json())
        .then(data => {
            volumeSelect.innerHTML = '<option value="">不归档到案卷</option>';
            data.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id;
                opt.textContent = v.volume_code + ' - ' + v.volume_title;
                volumeSelect.appendChild(opt);
            });
        })
        .catch(() => { volumeSelect.innerHTML = '<option value="">加载失败</option>'; });
}

// 重新提取按钮
document.getElementById('btnReExtract').addEventListener('click', function () {
    const btn = this;
    const statusBox = document.getElementById('extractStatus');
    const msgEl = document.getElementById('extractMsg');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>提取中...';
    statusBox.style.display = 'none';

    fetch('/archive/api/file/{{ file.id }}/re-extract', {
        method: 'POST',
        headers: { 'X-CSRFToken': '{{ csrf_token() }}' }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            document.getElementById('inputKeywords').value = data.keywords_str || '';
            document.getElementById('inputTags').value = data.tags_str || '';
            document.getElementById('inputSummary').value = data.summary || '';
            if (data.has_content) {
                msgEl.textContent = '提取完成：' + (data.keywords_str || '未提取到关键词');
                statusBox.style.background = '#d1fae5';
                statusBox.style.color = '#065f46';
            } else {
                // 内容为空或不支持的格式
                const note = data.extract_note || '文件内容为空或格式不支持文本提取';
                msgEl.textContent = '⚠️ 内容提取受限：' + note + '（关键词/摘要/标签未能自动填充，请手动填写）';
                statusBox.style.background = '#fef3c7';
                statusBox.style.color = '#92400e';
            }
        } else {
            msgEl.textContent = '提取失败：' + (data.error || '未知错误');
            statusBox.style.background = '#fee2e2';
            statusBox.style.color = '#991b1b';
        }
        statusBox.style.display = 'block';
    })
    .catch(err => {
        msgEl.textContent = '请求失败：' + err;
        statusBox.style.background = '#fee2e2';
        statusBox.style.color = '#991b1b';
        statusBox.style.display = 'block';
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-magic me-1"></i>重新提取';
    });
});
</script>
</body>
</html>
