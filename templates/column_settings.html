{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>栏目设置</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <p>在下方勾选需要显示的栏目：</p>
            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" name="columns" value="smart_office" class="form-check-input" checked>
                    <label class="form-check-label">智能办公</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="columns" value="knowledge" class="form-check-input" checked>
                    <label class="form-check-label">知识管理</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="columns" value="qa" class="form-check-input" checked>
                    <label class="form-check-label">智能问答</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="columns" value="special_report" class="form-check-input" checked>
                    <label class="form-check-label">专项信息上报</label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
        </form>
    </div>
</div>
{% endblock %}
