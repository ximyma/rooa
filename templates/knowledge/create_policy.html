{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>新建政策库</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">政策库名称</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">创建</button>
            <a href="{{ url_for('policy_library') }}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
