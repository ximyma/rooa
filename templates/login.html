<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能服务办公平台 - 登录</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/fontawesome.all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Microsoft YaHei', 'SimHei', 'SimSun', 'PingFang SC', 'Hiragino Sans GB', 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #fff; /* 确保默认文字颜色为白色 */
        }

        /* 动态背景粒子 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(100, 200, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* 网格背景 */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(100, 200, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(100, 200, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(50px);
            }
        }

        /* 登录卡片 */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 32px rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            animation: cardAppear 0.8s ease-out;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo 区域 */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 60px;
            background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(0, 198, 251, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 20px rgba(0, 91, 234, 0.8));
            }
        }

        .logo-title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .logo-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 8px;
        }

        /* 表单样式 */
        .form-floating {
            margin-bottom: 25px;
        }

        .form-floating > .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 1rem 1rem 1rem 3rem;
            font-size: 15px;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .form-floating > .form-control:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #00c6fb;
            box-shadow: 0 0 20px rgba(0, 198, 251, 0.3);
            color: #fff;
        }

        .form-floating > .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-floating > label {
            color: rgba(255, 255, 255, 0.7);
            padding: 1rem 1rem 1rem 3rem;
        }

        .form-floating > .form-control:focus ~ label,
        .form-floating > .form-control:not(:placeholder-shown) ~ label {
            color: #00c6fb;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            z-index: 5;
        }

        /* 登录按钮 */
        .login-btn {
            background: linear-gradient(135deg, #00c6fb 0%, #005bea 100%);
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 198, 251, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        /* 记住我 & 忘记密码 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .form-check-input:checked {
            background-color: #00c6fb;
            border-color: #00c6fb;
        }

        .form-check-label {
            color: rgba(255, 255, 255, 0.7);
        }

        .forgot-password {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #00c6fb;
        }

        /* 错误提示 */
        .alert {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff6b6b;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 20px;
        }

        /* 底部信息 */
        .footer-info {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        /* 响应式 */
        @media (max-width: 576px) {
            .login-card {
                padding: 40px 30px;
            }

            .logo-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div class="grid-bg"></div>
    <div class="particles" id="particles"></div>

    <!-- 登录容器 -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-section">
                <i class="fas fa-rocket logo-icon"></i>
                <h1 class="logo-title">智能服务办公平台</h1>
                <p class="logo-subtitle">Intelligent Office Automation System</p>
            </div>

            <!-- 表单 -->
            <form method="POST">
                <!-- CSRF Token -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- 错误提示 -->
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                        <div class="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <!-- 用户名 -->
                <div class="form-floating">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" class="form-control" id="username" name="username" 
                           placeholder=" " value="{{ request.form.username }}" required>
                    <label for="username">用户名</label>
                </div>

                <!-- 密码 -->
                <div class="form-floating">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder=" " required>
                    <label for="password">密码</label>
                </div>



                <!-- 记住我 & 忘记密码 -->
                <div class="form-options">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">
                            记住我
                        </label>
                    </div>
                    <a href="#" class="forgot-password">忘记密码?</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt me-2"></i> 登 录
                </button>
            </form>

            <!-- 底部信息 -->
            <div class="footer-info">
                <p>© 2026 智能服务办公平台 | 版本 2.0</p>
            </div>
        </div>
    </div>

    <script>
        // 生成粒子效果
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(particle);
            }
        }

        createParticles();

        // 表单输入动画
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.input-icon').style.color = '#00c6fb';
            });

            input.addEventListener('blur', function() {
                this.parentElement.querySelector('.input-icon').style.color = 'rgba(255, 255, 255, 0.5)';
            });
        });
    </script>
</body>
</html>
