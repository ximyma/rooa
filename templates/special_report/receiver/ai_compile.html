{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-12">
        <h2>AI汇编</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <table class="table table-bordered">
                <thead><tr><th>选择</th><th>标题</th><th>报送人</th><th>内容预览</th></tr></thead>
                <tbody>
                    {% for report in reports %}
                    <tr>
                        <td><input type="checkbox" name="report_ids" value="{{ report.id }}"></td>
                        <td>{{ report.title }}</td>
                        <td>{{ report.reporter_name }}</td>
                        <td>{{ report.content[:50] }}...</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            <button type="submit" class="btn btn-primary">确认保存</button>
            <a href="{{ url_for('task_detail', task_id=task.id) }}" class="btn btn-secondary">取消</a>
        </form>
    </div>
</div>
{% endblock %}
